---
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./config :/config
      - /home/olivernix/hdd:/hdd
      - /home/olivernix/qbittorrent/downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped

